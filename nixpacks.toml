# Fallback when Railway builds with Nixpacks instead of Dockerfile.
[phases.setup]
nixPkgs = ["nodejs_20", "python311", "gcc"]

[phases.install]
cmds = [
  "npm install",
  "cd server && npm install",
  "cd client && npm install",
  "pip3 install --break-system-packages -r server/requirements.txt || pip3 install -r server/requirements.txt"
]

[phases.build]
cmds = ["cd client && npm run build"]

[start]
cmd = "cd server && node index.js"
