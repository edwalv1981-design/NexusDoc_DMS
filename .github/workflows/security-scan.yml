name: Security scan (sitio publicado)

# Escaneo externo de solo lectura: TLS, cabeceras, archivos expuestos, API sin
# token, CORS y login. Se lanza a mano o cada lunes. No modifica datos.
on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'Dominios separados por espacio (vacío = todos los configurados)'
        required: false
        default: ''
  schedule:
    - cron: '17 13 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Escanear sitio publicado
        env:
          SCAN_DOMAINS: ${{ github.event.inputs.domains }}
        # $SCAN_DOMAINS sin comillas a propósito: se separa por espacios en argumentos.
        run: node scripts/security-scan.mjs $SCAN_DOMAINS

  browser-check:
    # Abre el sitio en Chromium real: detecta pantalla en blanco o scripts
    # bloqueados por la Content-Security-Policy.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright + Chromium
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Revisar sitio en navegador
        working-directory: ${{ runner.temp }}
        run: |
          cp "$GITHUB_WORKSPACE/scripts/browser-csp-check.mjs" .
          node browser-csp-check.mjs https://www.nexusdoc.online/ https://nexusdocdms-production.up.railway.app/
