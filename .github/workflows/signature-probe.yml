name: Prueba del validador de firmas

# Solo diagnóstico: genera PDF de prueba y los pasa por server/scripts/signature_agent.py
on:
  push:
    branches: ['probe/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # igual que la imagen node:20-slim (Debian bookworm)
      - name: Dependencias (misma versión de PyMuPDF que producción)
        run: pip install -r server/requirements.txt
      - name: Certificados de prueba
        run: bash server/scripts/sigtest/make_certs.sh "$RUNNER_TEMP/sig"
      - name: Generar PDF de prueba
        run: python server/scripts/sigtest/make_samples.py "$RUNNER_TEMP/sig"
      - name: Evaluar
        env:
          SIGNATURE_TRUST_DIR: ${{ runner.temp }}/sig/trust
        run: python server/scripts/sigtest/run_probe.py "$RUNNER_TEMP/sig"
