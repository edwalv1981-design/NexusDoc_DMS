name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server-tests:
    # ubuntu-22.04 viene con libasound2 (Ubuntu 24.04+ lo renombró a libasound2t64).
    # Pinear evita romper el job cada vez que GitHub avanza ubuntu-latest.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install system libraries (Puppeteer / Chromium)
        # `libasound2t64` se prueba primero porque algunas imágenes ya migraron a Ubuntu 24.04.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates fonts-liberation libatk-bridge2.0-0 libatk1.0-0 \
            libcairo2 libcups2 libdbus-1-3 libdrm2 libexpat1 libfontconfig1 libgbm1 \
            libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 \
            libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 xdg-utils
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install npm dependencies
        run: npm ci

      - name: Unit tests (layout PDF / Corporación)
        run: npm test

      - name: Smoke — PDF Corporación HTML + Puppeteer
        run: npm run test:smoke-corporacion-pdf

      - name: Smoke pesado — muchos directores / accionistas
        run: npm run test:smoke-corporacion-pdf-heavy
