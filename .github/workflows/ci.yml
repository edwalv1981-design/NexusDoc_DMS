name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    # Unit tests son el GATE de Railway: rápidos (<2 min) y sin dependencias del sistema.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install npm dependencies (ignoring Puppeteer download)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Unit tests (layout PDF / i18n / stable forms)
        run: npm test

  smoke-tests:
    # Smoke con Puppeteer real. Va aparte para no bloquear deploys cuando GitHub Actions
    # cambia el runner y rompe libs del sistema (libasound2 → libasound2t64, etc.).
    runs-on: ubuntu-22.04
    needs: unit-tests
    continue-on-error: true
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install system libraries (Puppeteer / Chromium)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates fonts-liberation libatk-bridge2.0-0 libatk1.0-0 \
            libcairo2 libcups2 libdbus-1-3 libdrm2 libexpat1 libfontconfig1 libgbm1 \
            libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 \
            libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 xdg-utils \
            libasound2 || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libasound2t64

      - name: Install npm dependencies
        run: npm ci

      - name: Smoke — PDF Corporación HTML + Puppeteer
        run: npm run test:smoke-corporacion-pdf

      - name: Smoke pesado — muchos directores / accionistas
        run: npm run test:smoke-corporacion-pdf-heavy
